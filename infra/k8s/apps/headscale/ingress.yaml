# Replace <VPN-HOSTNAME>.<YOUR-DOMAIN> with the public hostname for Headscale/Headplane (e.g. headscale.example.com).
# See docs/k8s/apps/headscale.md
#
# ingressClassName is "traefik" (native), not a leftover from the Ingress
# NGINX -> Traefik migration - see docs/k8s/core/ingress-traefik-migration.md.
# No ssl-redirect annotation is needed: HTTP -> HTTPS is handled once, globally,
# at the Traefik entrypoint (see rke2-traefik-config.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headscale
  namespace: headscale
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - <VPN-HOSTNAME>.<YOUR-DOMAIN>
      secretName: wildcard-prod-tls
  rules:
    - host: <VPN-HOSTNAME>.<YOUR-DOMAIN>
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: headplane
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headscale
                port:
                  number: 8080
