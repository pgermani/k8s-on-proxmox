# Replace <QBITTORRENT-HOSTNAME>.<YOUR-DOMAIN> with the public hostname for qbittorrent (e.g. qbittorrent.example.com).
#
# ingressClassName is "traefik" (native), not a leftover from the Ingress
# NGINX -> Traefik migration - see docs/k8s/core/ingress-traefik-migration.md.
# No ssl-redirect annotation is needed: HTTP -> HTTPS is handled once, globally,
# at the Traefik entrypoint (see rke2-traefik-config.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent
  namespace: qbittorrent
spec:
  ingressClassName: traefik
  rules:
  - host: <QBITTORRENT-HOSTNAME>.<YOUR-DOMAIN>
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: qbittorrent
            port:
              number: 8080
  tls:
  - hosts:
    - <QBITTORRENT-HOSTNAME>.<YOUR-DOMAIN>
    secretName: wildcard-prod-tls
