# Internal ClusterIssuer - issues self-signed certificates for names in the
# internal zone (e.g. *.homelab), which Let's Encrypt cannot validate.
#
# Every certificate it issues is signed by its own key: there is no CA
# certificate to trust once, so browsers warn on each internal hostname.
# See docs/k8s/core/cert-manager-internal.md
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-ca
spec:
  selfSigned: {}
