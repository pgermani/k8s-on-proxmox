# Exposes the TrueNAS SMB server inside the cluster as a Service + Endpoints.
# See docs/k8s/storage/smb-csi.md
#
# NOTE: this Service is deliberately NOT headless (no clusterIP: None), and the
# Endpoints port is named to match the Service port. Found during the
# Ingress NGINX -> Traefik migration (see docs/k8s/core/ingress-traefik-migration.md,
# section 5.4): a headless, selectorless Service with manually-managed
# Endpoints makes Traefik return "503 no available server" (a known Traefik
# limitation, Ingress NGINX is unaffected); and once made non-headless, a
# mismatched port name between the Service and its Endpoints silently breaks
# kube-proxy's ClusterIP routing ("connection refused", even though
# `kubectl get endpoints` looks correct) - harmless while headless, since a
# headless Service gets no kube-proxy ClusterIP routing at all.
apiVersion: v1
kind: Endpoints
metadata:
  name: smb-server
  namespace: external-services
subsets:
  - addresses:
      - ip: <TRUENAS-IP>
    ports:
      - name: smb
        port: 445
        protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: smb-server
  namespace: external-services
spec:
  type: ClusterIP
  ports:
    - name: smb
      port: 445
      protocol: TCP
