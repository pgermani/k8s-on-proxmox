# Phase 3 - Traefik configuration after the switchover.
#
# The `ports` block is removed so Traefik falls back to the chart defaults and
# binds to host ports 80/443, taking over the traffic previously served by
# Ingress NGINX. No load balancer change is required: the upstream in
# infra/load-balancer/nginx/conf/nginx.conf still points at <worker-ip>:443.
#
# The kubernetesIngressNGINX provider stays enabled because the migrated
# Ingress resources keep the `rke2-ingress-nginx-migration` class and their
# nginx.ingress.kubernetes.io/* annotations.
#
# > Note: keep the same provider key spelling used in phase 1 - `kubernetesIngressNginx`
# > (lowercase "nginx") on releases older than v1.36.2 / v1.35.6 / v1.34.9 / v1.33.13,
# > which includes the v1.32 line.
#
# The `web` entrypoint (port 80) redirects every request to `websecure` (port
# 443). This replicates, explicitly, a default that Ingress NGINX gave for
# free: it redirects HTTP to HTTPS automatically whenever an Ingress has a
# `tls:` block, with no annotation needed. Traefik has no such implicit
# behaviour - without this block, an Ingress with a `tls:` section would still
# serve plain HTTP on port 80 unless redirected per-router. This same block is
# also documented in docs/rke2-bootstrap.md ("Choose the Ingress Controller"),
# so a fresh install and a migrated cluster end up configured identically -
# RKE2's own rke2-traefik chart ships this redirect commented out by default.
#
# The redirect is unconditional once set: there is no per-Ingress opt-out
# (aside from the ACME HTTP-01 challenge path, irrelevant here since this
# cluster uses DNS-01). To test an app over plain HTTP, bypass the Ingress
# entirely with `kubectl port-forward` to its Service instead.
#
# transport.respondingTimeouts.readTimeout is raised to 600s on both
# entrypoints. Traefik's own default (60s, since v2.11.2) caps the time
# allowed to read an entire incoming request, body included - a real cutoff,
# not a theoretical one: gokapi's validated 2GB upload (see
# docs/k8s/core/ingress-traefik-migration.md) took 111s, well past the
# default. Unlike the three nginx.ingress.kubernetes.io/proxy-*-timeout
# annotations gokapi used to carry, this has no native per-Ingress or
# per-Service equivalent - entrypoint read timeouts are a property of the
# underlying Go HTTP server, shared by every route on that entrypoint. 600s
# matches the bound already validated under Ingress NGINX, rather than
# disabling the timeout outright (0s) on a cluster reachable from the
# internet.
#
# See docs/k8s/core/ingress-traefik-migration.md
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
        transport:
          respondingTimeouts:
            readTimeout: 600s
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 600s
    providers:
      kubernetesIngressNginx:
        enabled: true
        ingressClass: "rke2-ingress-nginx-migration"
        controllerClass: "rke2.cattle.io/ingress-nginx-migration"
