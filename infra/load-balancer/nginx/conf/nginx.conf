# NGINX L4 (stream) load balancer for the Kubernetes cluster.
#
# Ingress is split into two planes, kept apart by listener - see
# docs/k8s/core/ingress-planes.md:
#
#   443   Internal listener. LAN and VPN clients (Pi-hole resolves internal
#         names to this VM). The router never forwards to it. Source-restricted,
#         then passed to Traefik's internal entrypoint (nodes :443).
#   8443  Public listener. The only port the router forwards from the internet
#         (external 443 -> <LB-IP>:8443). Accepts only SNI under <YOUR-DOMAIN>,
#         then passes to Traefik's public entrypoint (nodes :8444).
#   6443  Kubernetes API server. LAN and VPN only.
#
# Both ingress listeners prepend a PROXY protocol v1 header so Traefik sees the
# real client address. TLS is never terminated here (passthrough).
#
# The container must run with network_mode: host (../docker-compose.yaml):
# behind Docker's published-port NAT, $remote_addr is not guaranteed to be the
# real client address, and both the allow/deny rules and the PROXY header
# depend on it.
#
# Replace every <...> placeholder before deploying. The ingress upstreams
# (<node-N-ip>) list every node running the rke2-traefik DaemonSet - control
# plane included, if it runs Traefik as in this cluster.

worker_processes auto;

events {
    worker_connections 4096;
}

stream {

    log_format planes '$remote_addr [$time_local] port=$server_port '
                      'sni="$ssl_preread_server_name" status=$status '
                      'upstream="$upstream_addr" in=$bytes_received '
                      'out=$bytes_sent time=$session_time';
    access_log /dev/stdout planes;

    # Kubernetes API server - LAN and VPN only.
    #
    # <ROUTER-IP> is denied on every internal listener: the router never needs
    # them, and if it ever NATs forwarded internet traffic (hairpin NAT,
    # firmware change) that traffic must not pass as LAN.
    # VPN clients arrive through a Tailscale subnet router, SNATed to its LAN
    # address. Loopback is not allowed: internal names must resolve to this
    # VM's LAN address, never to its Tailscale address (see
    # docs/k8s/core/ingress-planes.md, section 5.5).

    upstream k8s_api {
        least_conn;
        server <control-plane-1-ip>:6443 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 6443 reuseport so_keepalive=5m:30s:5;

        deny  <ROUTER-IP>;
        allow <HOME-NETWORK-CIDR>;
        allow 100.64.0.0/10;
        deny  all;

        proxy_pass k8s_api;
        proxy_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Internal ingress plane - LAN and VPN only, every hostname.

    upstream k8s_ingress_internal {
        least_conn;
        server <node-1-ip>:443 max_fails=3 fail_timeout=30s;
        server <node-2-ip>:443 max_fails=3 fail_timeout=30s;
        server <node-3-ip>:443 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 443 reuseport so_keepalive=5m:30s:5;

        deny  <ROUTER-IP>;
        allow <HOME-NETWORK-CIDR>;
        allow 100.64.0.0/10;
        deny  all;

        proxy_pass k8s_ingress_internal;
        proxy_protocol on;
        proxy_timeout 10m;
        proxy_connect_timeout 5s;
    }

    # Public ingress plane - any source, public hostnames only.
    #
    # The SNI is read from the TLS ClientHello without decrypting anything.
    # `hostnames` makes .<YOUR-DOMAIN> match both the apex and every subdomain.
    # Anything else - internal names, no SNI at all (scans by IP) - goes to
    # sni_reject, which closes the connection without sending a byte.
    #
    # This is a first gate only: it cannot see the Host header inside TLS. The
    # second gate is Traefik's public entrypoint, which only has routers for
    # Ingresses explicitly marked public.

    map $ssl_preread_server_name $public_backend {
        hostnames;
        .<YOUR-DOMAIN>  k8s_ingress_public;
        default         sni_reject;
    }

    upstream k8s_ingress_public {
        least_conn;
        server <node-1-ip>:8444 max_fails=3 fail_timeout=30s;
        server <node-2-ip>:8444 max_fails=3 fail_timeout=30s;
        server <node-3-ip>:8444 max_fails=3 fail_timeout=30s;
    }

    upstream sni_reject {
        server 127.0.0.1:8999;
    }

    server {
        listen 127.0.0.1:8999;
        return "";
    }

    server {
        listen 8443 reuseport so_keepalive=5m:30s:5;

        ssl_preread on;
        preread_timeout 5s;

        proxy_pass $public_backend;
        proxy_protocol on;
        proxy_timeout 10m;
        proxy_connect_timeout 5s;
    }

}
